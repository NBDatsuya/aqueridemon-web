<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="800" height="600" fill="#f1efe2"/>
  <defs>
    <marker id="zArrow" markerWidth="10" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="northArrow" markerWidth="8" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- 环场步道 -->
  <rect x="185" y="95" width="430" height="360" rx="50" fill="none" stroke="#ddd8c8" stroke-width="16"/>

  <!-- 足球场 -->
  <rect x="260" y="170" width="280" height="210" fill="#6aa65e" stroke="#4d7c0f" stroke-width="2"/>
  <rect x="330" y="170" width="70" height="210" fill="#74b268"/>
  <rect x="470" y="170" width="70" height="210" fill="#74b268"/>
  <rect x="270" y="180" width="260" height="190" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <line x1="400" y1="180" x2="400" y2="370" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="275" r="26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="275" r="3" fill="#ffffff"/>
  <rect x="270" y="235" width="40" height="80" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <rect x="490" y="235" width="40" height="80" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <text x="400" y="348" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">足球场</text>

  <!-- 北2 / 北1 -->
  <circle cx="330" cy="60" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="330" y="65" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">北2</text>
  <circle cx="470" cy="60" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="470" y="65" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">北1</text>
  <line x1="330" y1="78" x2="348" y2="164" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>
  <line x1="470" y1="78" x2="452" y2="164" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>

  <!-- 南1 / 南2 -->
  <circle cx="330" cy="490" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="330" y="495" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">南1</text>
  <circle cx="470" cy="490" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="470" y="495" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">南2</text>
  <line x1="330" y1="472" x2="348" y2="386" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>
  <line x1="470" y1="472" x2="452" y2="386" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>

  <!-- 西1 / 西2 -->
  <circle cx="140" cy="230" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="140" y="235" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">西1</text>
  <circle cx="140" cy="320" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="140" y="325" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">西2</text>
  <line x1="157" y1="230" x2="252" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>
  <line x1="157" y1="320" x2="252" y2="320" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>

  <!-- 东1 / 东2 -->
  <circle cx="660" cy="230" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="660" y="235" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">东1</text>
  <circle cx="660" cy="320" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="660" y="325" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">东2</text>
  <line x1="643" y1="230" x2="548" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>
  <line x1="643" y1="320" x2="548" y2="320" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>

  <!-- 指北针 -->
  <line x1="735" y1="74" x2="735" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#northArrow)"/>
  <text x="735" y="92" text-anchor="middle" fill="#475569" font-size="13">北</text>

  <!-- 图例 -->
  <circle cx="270" cy="546" r="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="288" y="551" fill="#1f2937" font-size="12">刷新点</text>
  <line x1="370" y1="546" x2="410" y2="546" stroke="#dc2626" stroke-width="2.5" marker-end="url(#zArrow)"/>
  <text x="424" y="551" fill="#1f2937" font-size="12">丧尸进入方向</text>
  <text x="400" y="580" text-anchor="middle" fill="#6b7280" font-size="11">刷新点距场地边缘约15-20米，以雾气/建筑遮挡，玩家不可见</text>
</svg>
